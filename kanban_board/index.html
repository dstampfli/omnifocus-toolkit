<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban</title>
<!-- Inline favicon (three board columns on a rail-blue tile) so Chrome tabs and
     bookmarks show a board glyph instead of the default globe; no extra file/route. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B5D8C'/%3E%3Crect x='5' y='7' width='6' height='18' rx='1.5' fill='%23fff'/%3E%3Crect x='13' y='7' width='6' height='12' rx='1.5' fill='%23fff'/%3E%3Crect x='21' y='7' width='6' height='15' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #EDF0F3;
    --lane: #E2E7EC;
    --lane-edge: #D3DAE1;
    --card: #FFFFFF;
    --card-edge: #CDD5DD;
    --ink: #17212B;
    --ink-2: #4B5865;
    --ink-3: #7A8794;
    --rail: #2B5D8C;
    --rail-soft: #B9CFE4;
    --drop: #DCE8F4;
    --overdue: #B3261E;
    --soon: #8A5A00;
    --flag: #C2410C;
    --font: "Seravek", "Avenir Next", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161A1F;
      --lane: #1E242B;
      --lane-edge: #2A323B;
      --card: #272F38;
      --card-edge: #37414C;
      --ink: #E7EBEF;
      --ink-2: #AEB8C2;
      --ink-3: #7C8792;
      --rail: #7FB2E5;
      --rail-soft: #33506B;
      --drop: #243447;
      --overdue: #F28B82;
      --soon: #E3B341;
      --flag: #F59E6B;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.35;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  :focus-visible { outline: 2px solid var(--rail); outline-offset: 2px; }

  header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
    padding: 18px 28px 10px;
  }
  h1 { font-size: 28px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--ink-2);
  }
  .controls label { display: flex; align-items: center; gap: 6px; }
  select, button {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--rail); }

  /* Checkbox dropdowns for the Project and Tag filters. The panel lives inside
     the .filter container, which render() never replaces, so an open panel
     survives the 30-second refresh; only its rows are rebuilt. */
  .filter { position: relative; }
  .filter-button { display: flex; align-items: center; gap: 6px; max-width: 280px; }
  .filter-button .filter-name { color: var(--ink-2); }
  .filter-button .filter-value {
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filter-button .filter-caret { color: var(--ink-3); font-size: 11px; }
  .filter.open .filter-button { border-color: var(--rail); }
  .filter-panel {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 20;
    min-width: 250px;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    padding: 0 0 6px;
  }
  .filter-head {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 12px 6px;
    font-size: 12px;
    color: var(--ink-3);
    background: var(--card);
    border-bottom: 1px solid var(--lane-edge);
  }
  .filter-clear { border: 0; background: none; padding: 0; color: var(--rail); font-size: 12px; }
  .filter-clear:hover { text-decoration: underline; }
  .filter-clear:disabled { color: var(--ink-3); cursor: default; text-decoration: none; }
  .filter-list { list-style: none; margin: 0; padding: 4px 0 0; }
  .filter-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px calc(12px + var(--depth, 0) * 16px);
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-list label:hover { background: var(--drop); }
  .filter-list input { accent-color: var(--rail); margin: 0; }
  .filter-list .name { flex: 1; }
  .filter-list .count { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .filter-list .muted .name { color: var(--ink-3); }

  #banner {
    margin: 0 28px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--card);
    border-left: 4px solid var(--overdue);
    font-size: 14px;
  }

  #board {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
    padding: 14px 28px 24px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .lane {
    flex: 1 0 260px;
    max-width: 360px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--lane);
    border: 1px solid var(--lane-edge);
    border-radius: 10px;
  }
  .lane.over { background: var(--drop); border-color: var(--rail); }

  /* The rail: one line running through every lane header, a node per lane. */
  .lane-head {
    position: relative;
    padding: 26px 16px 10px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .lane-head::before {
    content: "";
    position: absolute;
    top: 14px;
    left: 16px;
    right: 0;
    height: 2px;
    background: var(--rail-soft);
  }
  .lane + .lane .lane-head::before { left: -17px; }
  .lane:last-child .lane-head::before { right: 16px; }
  .lane-head::after {
    content: "";
    position: absolute;
    top: 10px;
    left: 16px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--rail);
  }
  .lane-name { font-size: 20px; font-weight: 500; }
  .lane-count { font-size: 14px; color: var(--ink-3); }

  .cards {
    flex: 1;
    min-height: 40px;
    overflow-y: auto;
    padding: 0 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .empty { color: var(--ink-3); font-size: 14px; padding: 4px 6px 10px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: grab;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.45; }
  .card a { color: inherit; text-decoration: none; font-weight: 500; }
  .card a:hover { text-decoration: underline; text-decoration-color: var(--rail); }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 5px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .due.overdue { color: var(--overdue); font-weight: 500; }
  .due.soon { color: var(--soon); font-weight: 500; }
  .flag { color: var(--flag); }
  .tags { color: var(--ink-3); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    max-width: 80vw;
    padding: 10px 16px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--bg);
    font-size: 14px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .lane { transition: background-color 0.12s, border-color 0.12s; }
    .card { transition: opacity 0.12s; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Kanban</h1>
  <div class="controls">
    <div class="filter" id="project-filter">
      <button type="button" class="filter-button" aria-haspopup="true" aria-expanded="false">
        <span class="filter-name">Project</span>
        <span class="filter-value">All</span>
        <span class="filter-caret">&#9662;</span>
      </button>
      <div class="filter-panel" hidden>
        <div class="filter-head">
          <span class="filter-summary"></span>
          <button type="button" class="filter-clear">Clear</button>
        </div>
        <ul class="filter-list"></ul>
      </div>
    </div>
    <div class="filter" id="tag-filter">
      <button type="button" class="filter-button" aria-haspopup="true" aria-expanded="false">
        <span class="filter-name">Tag</span>
        <span class="filter-value">All</span>
        <span class="filter-caret">&#9662;</span>
      </button>
      <div class="filter-panel" hidden>
        <div class="filter-head">
          <span class="filter-summary"></span>
          <button type="button" class="filter-clear">Clear</button>
        </div>
        <ul class="filter-list"></ul>
      </div>
    </div>
    <label>Sort
      <select id="sort">
        <option value="due">Due date</option>
        <option value="title">Title</option>
        <option value="project">Project</option>
        <option value="added">Added</option>
      </select>
    </label>
    <button id="refresh" type="button">Refresh</button>
    <span id="updated"></span>
  </div>
</header>
<div id="banner" hidden></div>
<main id="board"></main>
<div id="toast" hidden></div>

<script>
(() => {
  const $ = (sel) => document.querySelector(sel);
  const INBOX = " inbox"; // project-filter id for cards with no project
  const UNTAGGED = " untagged"; // tag-filter id for cards with no (non-lane) tags
  // Filters hold the selected ids; an empty set means "show everything".
  // Within a filter the picks are ORed, across the two filters ANDed.
  const state = {
    board: null,
    projects: new Set(),
    tags: new Set(),
    sort: "due",
    dragging: false,
    inflight: 0,
  };

  // ------------------------------ data ------------------------------

  async function load() {
    try {
      const resp = await fetch("/api/board", { cache: "no-store" });
      const data = await resp.json();
      if (!resp.ok) {
        showBanner(data.error || ("The board server returned " + resp.status + "."));
        return;
      }
      state.board = data;
      hideBanner();
      render();
      $("#updated").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (err) {
      showBanner("Couldn't reach the board server. Is it still running? (" + err.message + ")");
    }
  }

  async function moveCard(card, laneId) {
    const fromLane = card.lane_id;
    card.lane_id = laneId;          // optimistic
    state.inflight += 1;
    render();
    try {
      const resp = await fetch("/api/move", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Kanban": "1" },
        body: JSON.stringify({ task_id: card.id, lane_id: laneId }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || ("server returned " + resp.status));
      Object.assign(card, data.card);
    } catch (err) {
      card.lane_id = fromLane;
      toast("Couldn't move “" + card.name + "”: " + err.message);
    } finally {
      state.inflight -= 1;
      render();
    }
  }

  // ------------------------------ sorting ------------------------------

  const projectName = (c) => (c.project && c.project.name) || "";
  const title = (c) => (c.name || "").toLowerCase();
  const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  const tie = (a, b) =>
    cmp(projectName(a).toLowerCase(), projectName(b).toLowerCase()) || cmp(title(a), title(b));

  function sortCards(cards, key) {
    const list = cards.slice();
    if (key === "title") {
      return list.sort((a, b) => cmp(title(a), title(b)) ||
        cmp(projectName(a).toLowerCase(), projectName(b).toLowerCase()));
    }
    const value = key === "project" ? (c) => projectName(c) || null
                : key === "added" ? (c) => c.added
                : (c) => c.due;
    const valued = list.filter((c) => value(c) !== null && value(c) !== undefined);
    const unvalued = list.filter((c) => value(c) === null || value(c) === undefined);
    if (key === "project") {
      valued.sort((a, b) =>
        cmp(projectName(a).toLowerCase(), projectName(b).toLowerCase()) ||
        cmp(a.due === null, b.due === null) || cmp(a.due || 0, b.due || 0) ||
        cmp(title(a), title(b)));
    } else if (key === "added") {
      valued.sort((a, b) => cmp(b.added, a.added) || tie(a, b));
    } else {
      valued.sort((a, b) => cmp(a.due, b.due) || tie(a, b));
    }
    return valued.concat(unvalued);
  }

  // ------------------------------ rendering ------------------------------

  function matchesProject(card) {
    if (state.projects.size === 0) return true;
    if (!card.project) return state.projects.has(INBOX);
    return state.projects.has(card.project.id);
  }

  // tag_ids already include ancestors (the server expands them), so picking a
  // parent tag matches every card tagged with any of its descendants.
  function matchesTag(card) {
    if (state.tags.size === 0) return true;
    const ids = card.tag_ids || [];
    if (ids.length === 0) return state.tags.has(UNTAGGED);
    return ids.some((id) => state.tags.has(id));
  }

  const matchesFilter = (card) => matchesProject(card) && matchesTag(card);

  // Rebuilds one checkbox dropdown from entries {id, name, count, depth}.
  // Drops selected ids no longer on offer, restores focus to the row that had
  // it (a change re-renders the rows), and returns the pruned selection.
  function fillFilter(root, entries, selected, noun) {
    const known = new Set(entries.map((e) => e.id));
    const picked = new Set([...selected].filter((id) => known.has(id)));
    // Only a checkbox row carries data-id; focus on the panel's own button or
    // Clear link has nothing to restore.
    const active = document.activeElement;
    const focusedId = root.contains(active) && typeof active.dataset.id === "string"
      ? active.dataset.id : null;

    const list = root.querySelector(".filter-list");
    list.textContent = "";
    for (const e of entries) {
      const li = document.createElement("li");
      const label = document.createElement("label");
      if (e.depth) label.style.setProperty("--depth", e.depth);
      if (!e.count) label.className = "muted";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.dataset.id = e.id;
      box.checked = picked.has(e.id);
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = e.name;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = e.count;
      label.append(box, name, count);
      li.appendChild(label);
      list.appendChild(li);
    }
    if (focusedId !== null) {
      const again = [...list.querySelectorAll("input")].find((i) => i.dataset.id === focusedId);
      if (again) again.focus();
    }

    const names = entries.filter((e) => picked.has(e.id)).map((e) => e.name);
    root.querySelector(".filter-value").textContent =
      names.length === 0 ? "All" :
      names.length <= 2 ? names.join(", ") :
      names.length + " " + noun;
    root.querySelector(".filter-summary").textContent =
      names.length === 0 ? "Showing all" : names.length + " selected";
    root.querySelector(".filter-clear").disabled = names.length === 0;
    return picked;
  }

  function renderFilters() {
    const b = state.board;
    const projects = new Map();
    let inbox = 0;
    let untagged = 0;
    for (const c of b.cards) {
      if (c.project) {
        const cur = projects.get(c.project.id) || { id: c.project.id, name: c.project.name, count: 0 };
        cur.count += 1;
        projects.set(c.project.id, cur);
      } else inbox += 1;
      if (!c.tag_ids || c.tag_ids.length === 0) untagged += 1;
    }
    // Projects: those with a card on the board, A-Z, plus Inbox when needed.
    const projectEntries = [...projects.values()]
      .sort((x, y) => cmp(x.name.toLowerCase(), y.name.toLowerCase()));
    if (inbox) projectEntries.push({ id: INBOX, name: "Inbox", count: inbox });
    // Tags: the whole OmniFocus tree (minus the Kanban lanes) in OmniFocus
    // order, indented by depth; zero-count tags stay listed but muted.
    const tagEntries = (b.tags || []).map((t) => ({ id: t.id, name: t.name, count: t.count, depth: t.depth }));
    tagEntries.push({ id: UNTAGGED, name: "Untagged", count: untagged });
    state.projects = fillFilter($("#project-filter"), projectEntries, state.projects, "projects");
    state.tags = fillFilter($("#tag-filter"), tagEntries, state.tags, "tags");
  }

  function setFilterOpen(root, open) {
    root.classList.toggle("open", open);
    root.querySelector(".filter-panel").hidden = !open;
    root.querySelector(".filter-button").setAttribute("aria-expanded", String(open));
  }
  function closeFilters(except) {
    document.querySelectorAll(".filter.open").forEach((f) => { if (f !== except) setFilterOpen(f, false); });
  }

  // Wires one dropdown: the button toggles it, a checkbox updates the given
  // selection set, Clear empties it. Panels close on outside click or Escape.
  function setupFilter(root, selected) {
    root.querySelector(".filter-button").addEventListener("click", () => {
      const open = !root.classList.contains("open");
      closeFilters(root);
      setFilterOpen(root, open);
    });
    root.querySelector(".filter-list").addEventListener("change", (ev) => {
      const box = ev.target;
      if (!(box instanceof HTMLInputElement)) return;
      if (box.checked) selected().add(box.dataset.id); else selected().delete(box.dataset.id);
      render();
    });
    root.querySelector(".filter-clear").addEventListener("click", () => {
      selected().clear();
      render();
    });
  }

  function formatDue(card) {
    const d = new Date(card.due);
    const sameYear = d.getFullYear() === new Date().getFullYear();
    const text = d.toLocaleDateString(undefined,
      sameYear ? { month: "short", day: "numeric" } : { year: "numeric", month: "short", day: "numeric" });
    return "Due " + text;
  }

  function cardEl(card) {
    const el = document.createElement("article");
    el.className = "card";
    el.draggable = true;
    el.dataset.id = card.id;
    if (card.note_excerpt) el.title = card.note_excerpt;

    const link = document.createElement("a");
    link.href = "omnifocus:///task/" + encodeURIComponent(card.id);
    link.textContent = card.name;
    el.appendChild(link);

    const meta = document.createElement("div");
    meta.className = "meta";
    const project = document.createElement("span");
    project.textContent = card.project ? card.project.name : "Inbox";
    meta.appendChild(project);
    if (card.due !== null && card.due !== undefined) {
      const due = document.createElement("span");
      due.className = "due" + (card.status === "Overdue" ? " overdue" : card.status === "DueSoon" ? " soon" : "");
      due.textContent = formatDue(card);
      meta.appendChild(due);
    }
    if (card.flagged) {
      const flag = document.createElement("span");
      flag.className = "flag";
      flag.textContent = "Flagged";
      meta.appendChild(flag);
    }
    if (card.tags && card.tags.length) {
      const tags = document.createElement("span");
      tags.className = "tags";
      tags.textContent = card.tags.join(", ");
      meta.appendChild(tags);
    }
    el.appendChild(meta);

    el.addEventListener("dragstart", (ev) => {
      state.dragging = true;
      ev.dataTransfer.setData("text/plain", card.id);
      ev.dataTransfer.effectAllowed = "move";
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => {
      state.dragging = false;
      el.classList.remove("dragging");
      document.querySelectorAll(".lane.over").forEach((l) => l.classList.remove("over"));
    });
    return el;
  }

  function laneEl(lane, cards) {
    const el = document.createElement("section");
    el.className = "lane";
    el.dataset.id = lane.id;

    const head = document.createElement("div");
    head.className = "lane-head";
    const name = document.createElement("span");
    name.className = "lane-name";
    name.textContent = lane.name;
    const count = document.createElement("span");
    count.className = "lane-count";
    count.textContent = String(cards.length);
    head.appendChild(name);
    head.appendChild(count);
    el.appendChild(head);

    const list = document.createElement("div");
    list.className = "cards";
    if (cards.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nothing here";
      list.appendChild(empty);
    }
    for (const c of cards) list.appendChild(cardEl(c));
    el.appendChild(list);

    el.addEventListener("dragover", (ev) => {
      ev.preventDefault();
      ev.dataTransfer.dropEffect = "move";
      el.classList.add("over");
    });
    el.addEventListener("dragleave", (ev) => {
      if (!el.contains(ev.relatedTarget)) el.classList.remove("over");
    });
    el.addEventListener("drop", (ev) => {
      ev.preventDefault();
      el.classList.remove("over");
      const id = ev.dataTransfer.getData("text/plain");
      const card = state.board.cards.find((c) => c.id === id);
      if (!card || card.lane_id === lane.id) return;
      moveCard(card, lane.id);
    });
    return el;
  }

  function render() {
    const b = state.board;
    if (!b) return;
    document.title = b.kanban_tag;
    $("#title").textContent = b.kanban_tag;
    renderFilters();
    const visible = b.cards.filter(matchesFilter);
    const board = $("#board");
    board.textContent = "";
    for (const lane of b.lanes) {
      const cards = sortCards(visible.filter((c) => c.lane_id === lane.id), state.sort);
      board.appendChild(laneEl(lane, cards));
    }
  }

  // ------------------------------ chrome ------------------------------

  function showBanner(message) {
    const el = $("#banner");
    el.textContent = message;
    el.hidden = false;
  }
  function hideBanner() { $("#banner").hidden = true; }

  let toastTimer = null;
  function toast(message) {
    const el = $("#toast");
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
  }

  setupFilter($("#project-filter"), () => state.projects);
  setupFilter($("#tag-filter"), () => state.tags);
  document.addEventListener("click", (ev) => {
    if (!(ev.target instanceof Element) || !ev.target.closest(".filter")) closeFilters();
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeFilters(); });
  $("#sort").addEventListener("change", (ev) => { state.sort = ev.target.value; render(); });
  $("#refresh").addEventListener("click", load);
  setInterval(() => { if (!state.dragging && state.inflight === 0) load(); }, 30000);
  load();
})();
</script>
</body>
</html>
